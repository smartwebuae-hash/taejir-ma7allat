async function settingsGet(key){

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function isoToDisplay(iso){
  if(!iso) return '-';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function daysRemaining(endIso){
  if(!endIso) return null;
  const end = new Date(endIso + 'T00:00:00');
  const today = new Date(todayISO() + 'T00:00:00');
  return Math.round((end - today) / (1000*60*60*24));
}
function statusFor(endIso){
  const days = daysRemaining(endIso);
  if(days === null) return { cls:'good', badge:'badge-good', label:'بدون تاريخ' };
  if(days < 0) return { cls:'expired', badge:'badge-expired', label:'منتهي منذ ' + Math.abs(days) + ' يوم' };
  if(days <= 60) return { cls:'danger', badge:'badge-danger', label: days + ' يوم متبقي' };
  if(days <= 90) return { cls:'warn', badge:'badge-warn', label: days + ' يوم متبقي' };
  return { cls:'good', badge:'badge-good', label: days + ' يوم متبقي' };
}

function handleContractFileSelected(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file || !pendingImageShopId) return;
  const shopId = pendingImageShopId;
  pendingImageShopId = null;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = function(ev){
    img.onload = async function(){
      const maxDim = 1000;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      const shop = state.shops.find(s=>s.id===shopId);
      if(shop){
        shop.contractImages.push(dataUrl);
        await saveShops();
        render();
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function canvasToPdfBlob(canvas){
  const { jsPDF } = window.jspdf;
  const imgWidth = canvas.width;
  const imgHeight = canvas.height;
  const pdfWidthMM = 190;
  const pxToMM = pdfWidthMM / imgWidth;
  const pdfHeightMM = imgHeight * pxToMM;
  const pageHeightMM = 277;
  const marginX = 10, marginY = 10;
  const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  if(pdfHeightMM <= pageHeightMM){
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', marginX, marginY, pdfWidthMM, pdfHeightMM);
  } else {
    const pageHeightPx = Math.floor(pageHeightMM / pxToMM);
    let renderedHeight = 0; let first = true;
    while(renderedHeight < imgHeight){
      const sliceHeight = Math.min(pageHeightPx, imgHeight - renderedHeight);
      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = imgWidth; pageCanvas.height = sliceHeight;
      const ctx = pageCanvas.getContext('2d');
      ctx.drawImage(canvas, 0, renderedHeight, imgWidth, sliceHeight, 0, 0, imgWidth, sliceHeight);
      const sliceHeightMM = sliceHeight * pxToMM;
      if(!first) pdf.addPage();
      pdf.addImage(pageCanvas.toDataURL('image/png'), 'PNG', marginX, marginY, pdfWidthMM, sliceHeightMM);
      renderedHeight += sliceHeight; first = false;
    }
  }
  return pdf.output('blob');
}
async function shareOrDownloadPdf(canvas, filenameBase){
  if(typeof window.jspdf === 'undefined'){ alert('تعذّر تحميل أداة إنشاء PDF.'); return; }
  let pdfBlob;
  try{ pdfBlob = canvasToPdfBlob(canvas); }catch(e){ alert('تعذّر إنشاء ملف PDF.'); return; }
  const fname = filenameBase + '.pdf';
  const file = new File([pdfBlob], fname, { type:'application/pdf' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title: filenameBase }); return; }catch(e){}
  }
  const url = URL.createObjectURL(pdfBlob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  alert('تم حفظ ملف PDF في جهازك. افتحه وشاركه على واتساب.');
}

      </tr>
    `;
  }).join('');
  const wrapper = document.createElement('div');
  wrapper.style.position='fixed'; wrapper.style.left='-9999px'; wrapper.style.top='0';
  wrapper.style.width='650px'; wrapper.style.background='#fff'; wrapper.style.padding='18px';
  wrapper.style.fontFamily="'Segoe UI', Tahoma, Arial, sans-serif"; wrapper.style.direction='rtl'; wrapper.style.color='#000';
  wrapper.innerHTML = `
    <h1 style="text-align:center;font-size:20px;margin:0 0 4px;">تقرير إيجار المحلات</h1>
    <p style="text-align:center;color:#555;font-size:13px;margin:0 0 14px;">${isoToDisplay(todayISO())}</p>
    <table style="width:100%;border-collapse:collapse;min-width:0;table-layout:fixed;">
      <thead>
        <tr style="background:#eee;">
          <th style="border:1.5px solid #000;padding:8px;font-size:13px;">المحل</th>
          <th style="border:1.5px solid #000;padding:8px;font-size:13px;">المستأجر</th>
          <th style="border:1.5px solid #000;padding:8px;font-size:13px;">بداية العقد</th>
          <th style="border:1.5px solid #000;padding:8px;font-size:13px;">نهاية العقد</th>
          <th style="border:1.5px solid #000;padding:8px;font-size:13px;">الحالة</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  document.body.appendChild(wrapper);
  let canvas;
  try{
    canvas = await html2canvas(wrapper, {
      backgroundColor:'#ffffff', scale:2, useCORS:true,
      windowWidth: wrapper.scrollWidth, windowHeight: wrapper.scrollHeight,
      width: wrapper.scrollWidth, height: wrapper.scrollHeight
    });
  }catch(e){
    document.body.removeChild(wrapper);
    alert('تعذّر إنشاء التقرير.');
    return;
  }
  document.body.removeChild(wrapper);
  await shareOrDownloadPdf(canvas, 'تقرير-إيجار-المحلات-' + todayISO());
}

function playAlertSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const playBeep = (freq, startTime, duration)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.3, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    };
    const now = ctx.currentTime;
    playBeep(880, now, 0.18);
    playBeep(880, now + 0.25, 0.18);
  }catch(e){}
}

  if(!state.loggedIn){
    app.innerHTML = `
      <div class="center-screen">
        <h1>متابعة إيجار المحلات</h1>
        <p class="sub">تسجيل الدخول</p>
        <div class="card">
          ${state.loginError ? `<div class="msg msg-error">${state.loginError}</div>` : ''}
          <label>اسم المستخدم</label>
          <input type="text" id="username-input" placeholder="اسم المستخدم">
          <label>كلمة السر</label>
          <input type="password" id="password-input" placeholder="••••••••">
          <button class="big btn-primary" id="login-btn">دخول</button>
        </div>
      </div>
    `;
    document.getElementById('login-btn').onclick = ()=>{
      const u = document.getElementById('username-input').value.trim();
      const p = document.getElementById('password-input').value;
      if(u === creds.username && p === creds.password){
        state.loggedIn = true;
        state.loginError = null;
        const hasUrgent = state.shops.some(s=>{
          const d = daysRemaining(s.endDate);
          return d !== null && d <= 90;
        });
        if(hasUrgent) playAlertSound();
      } else {
        state.loginError = 'اسم المستخدم أو كلمة السر غير صحيحة';
      }
      render();
    };
    return;
  }

  const selectedShop = state.selectedShopId ? state.shops.find(s=>s.id===state.selectedShopId) : null;

  if(selectedShop){
    renderShopDetail(app, selectedShop);
    restoreFocusAndReturn(focusInfo);
    return;
  }

  const searchTerm = state.search.trim();
  const filtered = state.shops.filter(s => (s.name||'').includes(searchTerm) || (s.tenant||'').includes(searchTerm));
  const sorted = filtered.slice().sort((a,b)=>{
    const da = daysRemaining(a.endDate); const db = daysRemaining(b.endDate);
    if(da === null) return 1; if(db === null) return -1;
    return da - db;
  });

  const urgentCount = state.shops.filter(s=>{
    const d = daysRemaining(s.endDate);
    return d !== null && d <= 90;
  }).length;

  app.innerHTML = `
    <h1>متابعة إيجار المحلات</h1>
    <p class="sub">${isoToDisplay(todayISO())}</p>
    <div style="text-align:left;margin-bottom:8px;"><button class="logout no-print" id="logout-btn">خروج</button></div>
    ${messageBox()}
    ${urgentCount > 0
      ? `<div class="summary-banner summary-warn no-print">🔊 ⚠️ ${urgentCount} محل يحتاج تجديد خلال 3 أشهر أو أقل</div>`
      : `<div class="summary-banner summary-ok no-print">✅ لا توجد عقود قريبة من الانتهاء حاليًا</div>`}
    <div class="top-bar no-print">
      <input type="text" id="search-input" placeholder="🔍 ابحث باسم المحل أو المستأجر..." value="${state.search.replace(/"/g,'&quot;')}">
    </div>
    <div id="shops-list"></div>
    <button class="big btn-primary no-print" id="add-shop-btn" style="margin-top:6px;">+ إضافة محل جديد</button>
    <button class="big btn-ghost no-print" id="export-report-btn" style="margin-top:10px;">📲 تصدير تقرير PDF وإرسال واتساب</button>
    <button class="big no-print" id="import-contracts-btn" style="margin-top:10px;background:#fff6d9;color:#7a5c00;">📥 استيراد المحلات من العقود المرفوعة</button>
    <input type="file" id="contract-file-input" accept="image/*" style="display:none;">
    <div id="lightbox-overlay"><div class="gallery-box" id="gallery-box"></div></div>
  `;

  document.getElementById('logout-btn').onclick = ()=>{ state.loggedIn=false; render(); };
  document.getElementById('search-input').oninput = (e)=>{ state.search = e.target.value; render(); };
  document.getElementById('add-shop-btn').onclick = addShop;
  document.getElementById('export-report-btn').onclick = exportAllShopsReport;
  document.getElementById('import-contracts-btn').onclick = importContracts;
  document.getElementById('contract-file-input').onchange = handleContractFileSelected;
  document.getElementById('lightbox-overlay').onclick = (e)=>{ if(e.target.id === 'lightbox-overlay') closeGallery(); };

  const list = document.getElementById('shops-list');
  if(sorted.length === 0){
    list.innerHTML = `<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px 0;">لا توجد محلات مسجلة بعد</div>`;
  } else {
    sorted.forEach(shop=>{
      const st = statusFor(shop.endDate);
      const row = document.createElement('div');
      row.className = 'shop-row ' + st.cls;
      row.innerHTML = `
        <div class="shop-name">
          <div class="n">${shop.name || '(بدون اسم)'}</div>
          <div class="t">${shop.tenant ? 'المستأجر: ' + shop.tenant : ''}</div>
        </div>
        <span class="shop-badge ${st.badge}">${st.label}</span>
      `;
      row.onclick = ()=>{ state.selectedShopId = shop.id; state.editMode = false; render(); };
      list.appendChild(row);
    });
  }

  renderGalleryOverlay();
  restoreFocusAndReturn(focusInfo);
}

function renderShopDetail(app, shop){
  const st = statusFor(shop.endDate);
  if(state.editMode){
    app.innerHTML = `
      <h1>متابعة إيجار المحلات</h1>
      <button class="back-link no-print" id="back-btn">⬅ رجوع للقائمة</button>
      ${messageBox()}
      <div class="card">
        <label>اسم المحل</label>
        <input type="text" id="f-name" value="${(shop.name||'').replace(/"/g,'&quot;')}" placeholder="مثال: محل رقم 3">
        <label>اسم المستأجر</label>
        <input type="text" id="f-tenant" value="${(shop.tenant||'').replace(/"/g,'&quot;')}" placeholder="اسم المستأجر">
        <label>قيمة الإيجار السنوي (درهم)</label>
        <input type="number" id="f-rent" value="${shop.rentAmount||0}">
        <label>تاريخ بداية العقد</label>
        <input type="date" id="f-start" value="${shop.startDate||''}">
        <label>تاريخ نهاية العقد</label>
        <input type="date" id="f-end" value="${shop.endDate||''}">
        <label>ملاحظات</label>
        <textarea id="f-notes" placeholder="أي تفاصيل إضافية">${shop.notes||''}</textarea>
        <button class="big btn-good" id="save-shop-btn">💾 حفظ</button>
      </div>
    `;
    document.getElementById('back-btn').onclick = ()=>{ state.selectedShopId=null; state.editMode=false; render(); };
    document.getElementById('f-name').oninput = e=>{ shop.name = e.target.value; };
    document.getElementById('f-tenant').oninput = e=>{ shop.tenant = e.target.value; };
    document.getElementById('f-rent').oninput = e=>{ shop.rentAmount = parseFloat(e.target.value)||0; };
    document.getElementById('f-start').oninput = e=>{ shop.startDate = e.target.value; };
    document.getElementById('f-end').oninput = e=>{ shop.endDate = e.target.value; };
    document.getElementById('f-notes').oninput = e=>{ shop.notes = e.target.value; };
    document.getElementById('save-shop-btn').onclick = saveShopEdits;
    return;
  }

  app.innerHTML = `
    <h1>متابعة إيجار المحلات</h1>
    <button class="back-link no-print" id="back-btn">⬅ رجوع للقائمة</button>
    ${messageBox()}
    <div class="card">
      <div style="text-align:center;margin-bottom:10px;">
        <span class="shop-badge ${st.badge}" style="font-size:13px;padding:6px 14px;">${st.label}</span>
      </div>
      <div class="detail-row"><span class="k">اسم المحل</span><span>${shop.name || '-'}</span></div>
      <div class="detail-row"><span class="k">المستأجر</span><span>${shop.tenant || '-'}</span></div>
      <div class="detail-row"><span class="k">الإيجار السنوي</span><span>${(shop.rentAmount||0).toLocaleString()} درهم</span></div>
      <div class="detail-row"><span class="k">بداية العقد</span><span>${isoToDisplay(shop.startDate)}</span></div>
      <div class="detail-row"><span class="k">نهاية العقد</span><span>${isoToDisplay(shop.endDate)}</span></div>
      ${shop.notes ? `<div class="detail-row"><span class="k">ملاحظات</span><span>${shop.notes}</span></div>` : ''}
    </div>
    <div class="card no-print">
      <button class="big btn-primary" id="edit-btn" style="margin-bottom:10px;">✏️ تعديل البيانات</button>
      <button class="big btn-ghost" id="gallery-btn" style="margin-bottom:10px;">📎 صور العقد (${shop.contractImages.length})</button>
      <button class="big btn-danger" id="delete-btn">🗑 حذف هذا المحل</button>
    </div>
    <input type="file" id="contract-file-input" accept="image/*" style="display:none;">
    <div id="lightbox-overlay"><div class="gallery-box" id="gallery-box"></div></div>
  `;
  document.getElementById('back-btn').onclick = ()=>{ state.selectedShopId=null; render(); };
  document.getElementById('edit-btn').onclick = ()=>{ state.editMode=true; render(); };
  document.getElementById('gallery-btn').onclick = ()=> openGallery(shop.id);
  document.getElementById('delete-btn').onclick = ()=> deleteShop(shop.id);
  document.getElementById('contract-file-input').onchange = handleContractFileSelected;
  document.getElementById('lightbox-overlay').onclick = (e)=>{ if(e.target.id === 'lightbox-overlay') closeGallery(); };
  renderGalleryOverlay();
}

function renderGalleryOverlay(){
  const overlay = document.getElementById('lightbox-overlay');
  if(!overlay) return;
  if(!state.galleryShopId){
    overlay.classList.remove('open');
    return;
  }
  const shop = state.shops.find(s=>s.id===state.galleryShopId);
  if(!shop) return;
  overlay.classList.add('open');
  const box = document.getElementById('gallery-box');
  const imgs = shop.contractImages || [];
  if(state.galleryViewIndex !== null && imgs[state.galleryViewIndex]){
    box.innerHTML = `
      <div class="gallery-title">صورة عقد: ${shop.name || ''}</div>
      <img src="${imgs[state.galleryViewIndex]}" style="width:100%;border-radius:8px;margin-top:8px;">
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button id="gal-back-btn" class="btn-ghost" style="flex:1;padding:10px;">⬅ رجوع للصور</button>
        <button id="gal-del-btn" class="btn-danger" style="flex:1;padding:10px;">🗑 حذف الصورة</button>
      </div>
      <button id="gal-close-btn" class="btn-ghost" style="width:100%;margin-top:8px;padding:10px;">إغلاق ✕</button>
    `;
    document.getElementById('gal-back-btn').onclick = backToGalleryGrid;
    document.getElementById('gal-del-btn').onclick = ()=> deleteGalleryImage(shop.id, state.galleryViewIndex);
    document.getElementById('gal-close-btn').onclick = closeGallery;
  } else {
    const thumbsHtml = imgs.map((src, idx)=>`<div class="gallery-thumb" data-view-idx="${idx}"><img src="${src}"></div>`).join('');
    const addTile = imgs.length < MAX_IMAGES ? `<div class="gallery-add-tile" id="gal-add-tile">➕</div>` : '';
    box.innerHTML = `
      <div class="gallery-title">صور عقد: ${shop.name || ''} (${imgs.length}/${MAX_IMAGES})</div>
      <div class="gallery-grid">${thumbsHtml}${addTile}</div>
      <button id="gal-close-btn" class="btn-ghost" style="width:100%;margin-top:14px;padding:10px;">إغلاق ✕</button>
    `;
    box.querySelectorAll('[data-view-idx]').forEach(el=>{
      el.onclick = ()=> viewGalleryImage(parseInt(el.dataset.viewIdx,10));
    });
    const addTileEl = document.getElementById('gal-add-tile');
    if(addTileEl) addTileEl.onclick = ()=> triggerAddImage(shop.id);
    document.getElementById('gal-close-btn').onclick = closeGallery;
  }
}

function restoreFocusAndReturn(focusInfo){
  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el){
      el.focus();
      if(typeof el.setSelectionRange === 'function' && focusInfo.start !== null && focusInfo.start !== undefined){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }
}

function render(){ App(); }

init().catch(function(err){ showFatalError('Init failed: ' + (err && err.message ? err.message : err)); });
</script>
</body>
</html>
